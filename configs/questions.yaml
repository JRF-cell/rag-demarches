# Candidate questions generated on test sheets only (eval/split.json).
name: questions
seed: 42
# Check the exact model id and its free-tier limits in the Google AI Studio project.
model: gemini-flash-lite-latest
requests_per_minute: 10
max_calls_per_run: 110
n_fiches: 110
chunks_per_fiche: 5
questions_per_fiche: 3
min_chunk_words: 40
temperature: 0.7
prompt_version: v1
# A question is flagged for review when this share of its words appears in the chunk.
overlap_flag: 0.7
