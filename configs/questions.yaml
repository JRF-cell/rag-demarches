# Candidate questions generated on test sheets only (eval/split.json).
name: questions
seed: 42
# Exact id from the models.list endpoint (pinned, not a "-latest" alias).
model: gemini-3.5-flash-lite
# Free tier shown in AI Studio: 15 RPM, 250K TPM, 500 RPD. 12 RPM leaves a safety margin.
requests_per_minute: 12
requests_per_day: 500
max_calls_per_run: 110
n_fiches: 110
chunks_per_fiche: 5
questions_per_fiche: 3
min_chunk_words: 40
temperature: 0.7
prompt_version: v1
# A question is flagged for review when this share of its words appears in the chunk.
overlap_flag: 0.7
